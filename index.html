<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10162b">
<title>NEON RUN — Infinite Road</title>
<style>
:root{color-scheme:dark;--cyan:#62f5e1;--ink:#10162b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}.vignette{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,#080c1e30,transparent 30%,transparent 72%,#080c1e77),radial-gradient(ellipse at center,transparent 50%,#06091859)}.topbar{position:fixed;z-index:2;top:max(18px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;padding:0 clamp(16px,5vw,58px);pointer-events:none}.brand{font-size:12px;letter-spacing:.28em;font-weight:900;color:#fff;margin-top:12px}.brand span{color:var(--cyan)}.hud{display:flex;gap:10px}.stat{min-width:76px;padding:10px 15px 9px;border:1px solid #ffffff24;background:#141a35a8;backdrop-filter:blur(12px);border-radius:13px;text-align:right}.stat small{display:block;color:#a8b1ce;font-size:9px;letter-spacing:.17em;font-weight:800}.stat strong{font-size:18px;line-height:1.35;color:#fff;font-variant-numeric:tabular-nums}.coin strong{color:#ffd86f}.best strong{color:var(--cyan)}.pause{pointer-events:auto;border:1px solid #ffffff25;background:#141a35b8;color:#fff;border-radius:12px;width:42px;height:42px;margin-left:2px;font-size:16px}.center{position:fixed;z-index:3;inset:0;display:grid;place-items:center;padding:20px;transition:opacity .25s,visibility .25s}.center.hidden{opacity:0;visibility:hidden;pointer-events:none}.panel{width:min(420px,92vw);text-align:center;padding:34px 32px 28px;border:1px solid #ffffff27;border-radius:26px;background:linear-gradient(145deg,#19203ded,#10152ceb);box-shadow:0 24px 80px #080a20a1;backdrop-filter:blur(18px)}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.28em;color:var(--cyan);margin-bottom:13px}.panel h1{font-size:clamp(36px,10vw,62px);letter-spacing:-.055em;line-height:.95;margin:0;color:white;text-shadow:0 5px 35px #62f5e155}.panel h1 em{font-style:normal;color:var(--cyan)}.panel p{font-size:14px;line-height:1.6;color:#b1bbd5;margin:17px auto 23px;max-width:320px}.primary{border:0;border-radius:14px;background:linear-gradient(100deg,#58eadb,#9bffe7);color:#11202c;font-size:13px;font-weight:950;letter-spacing:.12em;padding:15px 30px;min-width:185px;cursor:pointer}.hint{color:#75809e;font-size:10px;letter-spacing:.1em;margin-top:16px}.touch-controls{position:fixed;z-index:2;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 clamp(18px,7vw,72px);pointer-events:none}.touch-btn{pointer-events:auto;width:64px;height:64px;border:1px solid #ffffff2a;border-radius:21px;color:white;font-size:24px;background:#151b36a8;backdrop-filter:blur(10px);display:grid;place-items:center;user-select:none}.touch-btn:active,.touch-btn.down{background:#62f5e13b;border-color:#62f5e1a8}.mobile-tip{position:fixed;bottom:max(30px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#d7dcf080;font-size:10px;letter-spacing:.15em;white-space:nowrap;pointer-events:none}@media(min-width:800px){.touch-controls,.mobile-tip{display:none}}@media(max-width:520px){.topbar{padding:0 10px}.stat{min-width:55px;padding:8px}.stat strong{font-size:14px}.stat small{font-size:7px}.hud{gap:5px}.pause{width:36px;height:38px}.brand{font-size:9px}.panel{padding:30px 22px 24px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Run infinite road game"></canvas><div class="vignette"></div>
<div class="topbar"><div class="brand">NEON<span> / </span>RUN</div><div class="hud"><div class="stat"><small>DISTANCE</small><strong id="score">00000</strong></div><div class="stat coin"><small>SHARDS</small><strong id="coins">◈ 0</strong></div><div class="stat best"><small>BEST</small><strong id="best">00000</strong></div><button class="pause" id="pause" aria-label="Pause">Ⅱ</button></div></div>
<div class="center" id="overlay"><section class="panel"><div class="eyebrow" id="eyebrow">A LITTLE SPEED. A LOT OF SKY.</div><h1 id="title">NEON<br><em>RUN</em></h1><p id="message">The road goes on forever. Dodge the traffic, collect the light, and see how far you can ride.</p><button class="primary" id="play">START YOUR RUN&nbsp; →</button><div class="hint" id="hint">← → TO STEER &nbsp;·&nbsp; A / D &nbsp;·&nbsp; SWIPE</div></section></div>
<div class="touch-controls"><button class="touch-btn" id="left" aria-label="Steer left">‹</button><button class="touch-btn" id="right" aria-label="Steer right">›</button></div><div class="mobile-tip">TAP ARROWS OR SWIPE TO STEER</div>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1,state='ready',last=performance.now(),world=0,speed=.18,score=0,coins=0,lane=1,targetLane=1,objects=[],spawn=.8,flash=0;
let best=Number(localStorage.getItem('neonRunBest')||0);$('best').textContent=String(best).padStart(5,'0');
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);
function startGame(){state='playing';world=0;speed=.18;score=0;coins=0;lane=targetLane=1;objects=[];spawn=.9;flash=0;$('coins').textContent='◈ 0';$('score').textContent='00000';$('overlay').classList.add('hidden');$('pause').textContent='Ⅱ';last=performance.now()}
function endGame(){if(state!=='playing')return;state='over';flash=1;best=Math.max(best,Math.floor(score));localStorage.setItem('neonRunBest',best);$('best').textContent=String(best).padStart(5,'0');$('eyebrow').textContent='THE ROAD IS STILL OUT THERE';$('title').innerHTML='NICE<br><em>RIDE</em>';$('message').textContent=`You made it ${Math.floor(score)} meters and found ${coins} light shard${coins===1?'':'s'}. Ready to beat your best?`;$('play').innerHTML='RIDE AGAIN&nbsp; →';$('hint').textContent='BEST DISTANCE: '+String(best).padStart(5,'0');$('overlay').classList.remove('hidden')}
function togglePause(){if(state==='playing'){state='paused';$('eyebrow').textContent='TAKE A BREATH';$('title').innerHTML='PAUSE<em>.</em>';$('message').textContent='The road can wait. Your run is safely paused.';$('play').textContent='KEEP RIDING';$('hint').textContent='TAP RESUME WHEN YOU’RE READY';$('overlay').classList.remove('hidden');$('pause').textContent='▶'}else if(state==='paused')startResume()}
function startResume(){state='playing';$('overlay').classList.add('hidden');$('pause').textContent='Ⅱ';last=performance.now()}
$('play').addEventListener('click',()=>state==='paused'?startResume():startGame());$('pause').addEventListener('click',togglePause);
function steer(dir){if(state!=='playing')return;targetLane=clamp(targetLane+dir,0,2)}$('left').addEventListener('pointerdown',e=>{e.preventDefault();steer(-1)});$('right').addEventListener('pointerdown',e=>{e.preventDefault();steer(1)});
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){e.preventDefault();steer(-1)}if(['ArrowRight','d','D'].includes(e.key)){e.preventDefault();steer(1)}if(e.key===' '||e.key==='Escape'){e.preventDefault();if(state==='playing'||state==='paused')togglePause();else if(state==='ready'||state==='over')startGame()}});
let touchX=null;canvas.addEventListener('pointerdown',e=>{touchX=e.clientX});canvas.addEventListener('pointerup',e=>{if(touchX===null)return;const dx=e.clientX-touchX;if(Math.abs(dx)>25)steer(dx<0?-1:1);touchX=null});
function roadAt(t){const horizon=H*.34,base=H*.94,y=horizon+(base-horizon)*t;const half=W*(.075+.39*t);return{x:W*.5,y,half}}
function laneX(l,t){const r=roadAt(t);return r.x+((l-1)*r.half*.64)}
function drawBackground(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#11152f');sky.addColorStop(.52,'#392451');sky.addColorStop(1,'#ed6570');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
const horizon=H*.34;ctx.fillStyle='#ffb18b';ctx.globalAlpha=.72;ctx.beginPath();ctx.arc(W*.5,horizon+H*.045,Math.min(W,H)*.085,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
// distant skyline
for(let i=0;i<34;i++){const x=i*W/33,seed=(i*37%91)/91,bh=H*(.04+seed*.12);ctx.fillStyle=i%2?'#25203f':'#201d3a';ctx.fillRect(x-9,horizon-bh,18,bh);if(i%3===0){ctx.fillStyle='#f9a66a';ctx.globalAlpha=.5;ctx.fillRect(x-4,horizon-bh+8,2,2);ctx.globalAlpha=1}}
// road and shoulders
const top=roadAt(0),bottom=roadAt(1);ctx.fillStyle='#14172c';ctx.beginPath();ctx.moveTo(top.x-top.half,horizon);ctx.lineTo(top.x+top.half,horizon);ctx.lineTo(bottom.x+bottom.half,H);ctx.lineTo(bottom.x-bottom.half,H);ctx.closePath();ctx.fill();
ctx.strokeStyle='#ff6689';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(top.x-top.half,horizon);ctx.lineTo(bottom.x-bottom.half,H);ctx.moveTo(top.x+top.half,horizon);ctx.lineTo(bottom.x+bottom.half,H);ctx.stroke();
// animated perspective lane marks
for(let i=0;i<18;i++){const t=((i/18+world*.23)%1);if(t<.02)continue;const r=roadAt(t),len=H*(.006+.026*t);ctx.strokeStyle=`rgba(111,225,230,${.2+.65*t})`;ctx.lineWidth=1+3*t;for(const k of [1,2]){const x=r.x+r.half*(k/3*2-1);ctx.beginPath();ctx.moveTo(x,r.y-len/2);ctx.lineTo(x,r.y+len/2);ctx.stroke()}}
// roadside light pillars
for(let i=0;i<12;i++){const t=((i/12+world*.13)%1);const r=roadAt(t),side=i%2?1:-1,x=r.x+side*(r.half+W*(.025+.015*t)),y=r.y;ctx.fillStyle='#fe638c';ctx.globalAlpha=.25+.7*t;ctx.fillRect(x-1,y-H*(.035*t),2,H*.035*t);ctx.fillStyle='#8efff0';ctx.beginPath();ctx.arc(x,y-H*(.035*t),1+3*t,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}
function drawCar(x,y,w,h,color,player=false){ctx.save();ctx.translate(x,y);ctx.shadowColor=color;ctx.shadowBlur=player?22:14;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-w*.5,h*.45);ctx.lineTo(-w*.44,-h*.23);ctx.lineTo(-w*.27,-h*.48);ctx.lineTo(w*.27,-h*.48);ctx.lineTo(w*.44,-h*.23);ctx.lineTo(w*.5,h*.45);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#17172c';ctx.beginPath();ctx.moveTo(-w*.29,-h*.19);ctx.lineTo(-w*.19,-h*.39);ctx.lineTo(w*.19,-h*.39);ctx.lineTo(w*.29,-h*.19);ctx.closePath();ctx.fill();ctx.fillStyle=player?'#c6fff5':'#ffb4a1';ctx.fillRect(-w*.38,h*.25,w*.19,h*.08);ctx.fillRect(w*.19,h*.25,w*.19,h*.08);ctx.restore()}
function drawObject(o){const t=o.z,r=roadAt(t),x=laneX(o.lane,t),size=.24+.95*t;if(o.kind==='coin'){const rad=(5+12*t)*Math.abs(Math.sin(performance.now()*.006+o.spin));ctx.save();ctx.shadowColor='#ffe276';ctx.shadowBlur=16;ctx.fillStyle='#ffe276';ctx.beginPath();ctx.arc(x,r.y-15*t,Math.max(3,rad),0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff5bd';ctx.beginPath();ctx.arc(x,r.y-15*t,Math.max(1,rad*.36),0,Math.PI*2);ctx.fill();ctx.restore()}else{const w=(20+31*t),h=(35+47*t);drawCar(x,r.y,w,h,o.color,false)}}
function update(dt){if(state!=='playing')return;speed=Math.min(.39,speed+dt*.0024);world+=dt*speed*2.7;score+=dt*(22+speed*80);$('score').textContent=String(Math.floor(score)).padStart(5,'0');lane+=(targetLane-lane)*Math.min(1,dt*11);spawn-=dt;
if(spawn<=0){const coin=Math.random()<.39;objects.push({kind:coin?'coin':'car',lane:Math.floor(Math.random()*3),z:0,color:['#fb627f','#8e79ff','#ffb54d'][Math.floor(Math.random()*3)],spin:Math.random()*6});spawn=rand(.54,1.05)*(.34/speed)}
for(const o of objects)o.z+=dt*speed*1.72;
for(let i=objects.length-1;i>=0;i--){const o=objects[i];if(o.z>.91&&o.z<1.01&&Math.abs(o.lane-lane)<.48){if(o.kind==='coin'){coins++;$('coins').textContent='◈ '+coins;o.z=2}else endGame()}if(o.z>1.12)objects.splice(i,1)}flash=Math.max(0,flash-dt*1.8)}
function render(){ctx.clearRect(0,0,W,H);drawBackground();objects.slice().sort((a,b)=>a.z-b.z).forEach(drawObject);if(state!=='over'){const r=roadAt(.94),carY=H*.83;const x=W*.5+(lane-1)*r.half*.64;drawCar(x,carY,W*.075,H*.11,'#62f5e1',true)}if(flash>0){ctx.fillStyle=`rgba(255,87,119,${flash*.18})`;ctx.fillRect(0,0,W,H)} }
function frame(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
</body>
</html>
